<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPANDE YA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="chatbot/css/styles.css">
</head>
<body>
    <div class="container-fluid p-0">
        <!-- Top Orange Bar -->
        <div class="top-bar bg-orange p-3 d-flex justify-content-between align-items-center">
            <div class="logo text-white fw-bold fs-4">EXPANDE YA</div>
            <div class="icons">
                <i class="fas fa-bell mx-2 text-white"></i>
                <i class="fas fa-user-circle mx-2 text-white"></i>
                <i class="fas fa-cog mx-2 text-white"></i>
            </div>
        </div>

        <div class="main-content d-flex">
            <!-- Left Sidebar -->
<div class="sidebar bg-primary p-3">
    <ul class="nav flex-column">
        <li class="nav-item mb-3">
    <a href="citas.html" class="nav-btn bg-light-blue text-white w-100 py-2 d-block text-decoration-none">
        <i class="fas fa-calendar-check me-2"></i>Citas
    </a>
</li>
        <li class="nav-item mb-3">
            <a href="cliente.html" class="nav-btn bg-light-blue text-white w-100 py-2 d-block text-decoration-none">
        <i class="fas fa-calendar-check me-2"></i>cliente
    </a>
        </li>
        <li class="nav-item mb-3">
            <button class="nav-btn bg-light-blue text-white w-100 py-2">
                <i class="fas fa-concierge-bell me-2"></i>Servicios
            </button>
        </li>
        <li class="nav-item mb-3">
            <button class="nav-btn bg-light-blue text-white w-100 py-2">
                <i class="fas fa-money-bill-wave me-2"></i>Pagos
            </button>
        </li>
        <li class="nav-item mb-3">
            <button class="nav-btn bg-light-blue text-white w-100 py-2">
                <i class="fas fa-ticket-alt me-2"></i>Tickets
            </button>
        </li>
        <li class="nav-item mb-3">
            <button class="nav-btn bg-light-blue text-white w-100 py-2 active">
                <i class="fas fa-robot me-2"></i>Chatbot
            </button>
        </li>
        <li class="nav-item mb-3">
            <button class="nav-btn bg-light-blue text-white w-100 py-2">
                <i class="fas fa-chart-bar me-2"></i>Reportes
            </button>
        </li>
    </ul>
</div>

            <!-- Chatbot Section -->
            <div class="chatbot-section flex-grow-1 p-4">
                <div class="chat-container bg-white rounded shadow">
                    <div class="chat-header bg-primary text-white p-3 rounded-top">
                        <h5 class="m-0"><i class="fas fa-robot me-2"></i>CHATBOT</h5>
                    </div>
                    <div class="chat-body p-3" id="chat-messages">
                        <div class="bot-message mb-3">
                            <div class="message-bubble bg-light p-3 rounded">
                                <p class="m-0">¿En qué le puedo ayudar?</p>
                            </div>
                        </div>
                    </div>
                    <div class="chat-footer p-3 border-top">
                        <div class="input-group">
                            <input type="text" class="form-control" id="user-input" placeholder="Escribe tu mensaje...">
                            <button class="btn btn-orange" id="send-btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="chatbot/js/script.js"></script>
</body>
</html>
